[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard-api"
version = "0.0.0"
description = "AgentGuard control-plane + runtime API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["agentguard_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these; don't lint generated migration bodies.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "S101",    # assert is fine in tests
    "RUF002",  # en-dash in docstrings is deliberate (matches the PRD)
    "RUF003",  # en-dash in comments is deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S603", "S607", "RUF059"]
"agentguard_api/models/enums.py" = ["S105"]  # enum member values, not secrets
"agentguard_api/auth/oauth.py" = ["S105", "S106"]  # provider endpoint URLs contain "token"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
