# AgentGuard — local backing services.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# The `apps` profile additionally runs the API and web dashboard in containers:
#
#   docker compose -f infra/docker-compose.yml --profile apps up --build -d
#
# Host ports default to an AgentGuard-specific block (54xx / 63xx / 90xx) so the
# stack does not collide with other local Postgres/Redis/Qdrant instances.
# Override any of them in `.env`.
name: agentguard

x-restart: &restart
  restart: unless-stopped

services:
  # --- PostgreSQL: core transactional database -----------------------------
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16   # postgres:16 + pgvector extension
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentguard}
      POSTGRES_USER: ${POSTGRES_USER:-agentguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentguard}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentguard} -d ${POSTGRES_DB:-agentguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redis: policy cache, rate limiting, session + approval state --------
  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Redpanda: Kafka-compatible runtime event stream --------------------
  redpanda:
    <<: *restart
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      - --check=false
    ports:
      - "${KAFKA_PORT:-19092}:19092"   # Kafka API (host)
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"     # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- ClickHouse: high-volume event storage + analytics -----------------
  clickhouse:
    <<: *restart
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-agentguard_events}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentguard}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentguard}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8124}:8123"     # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9011}:9000"   # native TCP
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Qdrant: threat-intel / attack-pattern vectors --------------------
  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_HTTP_PORT:-6343}:6333"     # HTTP
      - "${QDRANT_GRPC_PORT:-6344}:6334"     # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- MinIO: S3-compatible object storage -----------------------------
  minio:
    <<: *restart
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-agentguard}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-agentguard-secret}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9003}:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the default bucket on first boot, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-agentguard} ${S3_SECRET_KEY:-agentguard-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-agentguard-artifacts} &&
      echo 'bucket ready';
      "
    restart: "no"

  # --- Application containers (opt-in: --profile apps) ------------------
  api:
    <<: *restart
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentguard}:${POSTGRES_PASSWORD:-agentguard}@postgres:5432/${POSTGRES_DB:-agentguard}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      CLICKHOUSE_HOST: clickhouse
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-agentguard}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-agentguard-secret}
      S3_BUCKET: ${S3_BUCKET:-agentguard-artifacts}
      AGENTGUARD_SECRET_KEY: ${AGENTGUARD_SECRET_KEY:-dev-only-insecure-change-me}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *restart
    profiles: ["apps"]
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  clickhouse-data:
  qdrant-data:
  minio-data:
